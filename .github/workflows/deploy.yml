name: Deploy Examinai

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: examinai-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ielts.akai.ink
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Linux production artifact
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
          tar -czf .next-release.tgz .next

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host production\n  HostName %s\n  User examinai\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n' "$DEPLOY_HOST" > ~/.ssh/config

      - name: Upload release artifact
        run: |
          scp -o ConnectTimeout=20 deploy/release.sh production:/tmp/examinai-release.sh
          ssh -o ConnectTimeout=20 production 'install -m 755 /tmp/examinai-release.sh /var/examinai/deploy/release.sh && rm -f /tmp/examinai-release.sh'
          scp -o ConnectTimeout=20 .next-release.tgz production:/var/examinai/.next-release.tgz

      - name: Release
        run: ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 production 'bash /var/examinai/deploy/release.sh'
